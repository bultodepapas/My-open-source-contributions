name: Sync GitHub activity

on:
  workflow_dispatch:
  schedule:
    - cron: "17 13 * * 1"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Sync public GitHub facts
        run: npm run sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Test
        run: npm test
      - name: Validate public data
        run: npm run validate
      - name: Commit meaningful metadata changes
        shell: bash
        run: |
          if git diff --quiet -- data/generated/github.json; then
            echo "No public metadata changed."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/generated/github.json
            git commit -m "chore(data): sync public GitHub activity"
            git push
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload the static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
